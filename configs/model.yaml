seed: 42

target:
  name: speed
  unit: mph

horizons_steps:
  short: 1    # 5 minutes at 5-minute sampling
  medium: 3   # 15 minutes
  long: 6     # 30 minutes
  extra_long: 12  # 60 minutes

lags_steps:
  - 1
  - 2
  - 3
  - 6
  - 12
  - 24
  - 288   # previous day at 5-minute sampling (24 * 12)
  - 2016  # previous week (7 * 288)

rolling_windows_steps:
  - 3    # 15 minutes
  - 6    # 30 minutes
  - 12   # 60 minutes

spatial:
  neighbor_k: 8
  hop_depths: [1]
  distance_epsilon_km: 0.05

xgboost:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 4
  n_jobs: -1
  tree_method: hist
