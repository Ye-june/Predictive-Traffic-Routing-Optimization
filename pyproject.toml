[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficflow"
version = "0.1.0"
description = "Spatiotemporal traffic forecasting and prediction-aware route optimization."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "TrafficFlow" }]
keywords = [
    "traffic-forecasting",
    "spatiotemporal",
    "routing",
    "network-optimization",
    "time-series",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "networkx>=3.2",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "h5py>=3.8",
    "tables>=3.8",
    "requests>=2.31",
    "tqdm>=4.66",
    "scipy>=1.11",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]
app = [
    "streamlit>=1.28",
    "plotly>=5.18",
]

[project.urls]
Homepage = "https://github.com/elect/Predictive-Traffic-Routing-Optimization"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
